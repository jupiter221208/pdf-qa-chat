[project]
name = "pdf-qa-chat"
version = "0.1.0"
description = "Minimal Document QA chatbot with FastAPI, Agno, NiceGUI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "nicegui>=2.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-check>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
